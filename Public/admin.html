<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imart Store Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar navbar-dark store-nav"><div class="container"><a class="navbar-brand fw-bold" href="/">Imart<span> Store</span> ADMIN</a><a href="/" class="btn btn-outline-light btn-sm">View store</a></div></nav><main class="container admin-wrap py-5">
<div id="login-view" class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card admin-card p-4"><p class="eyebrow">PRIVATE DASHBOARD</p><h2>Admin login</h2><p class="text-secondary">Sign in using the admin email and password set in your hosting environment.</p><form id="login-form"><input class="form-control mb-3" name="email" type="email" placeholder="Admin email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-dark w-100">Login</button></form><div id="login-message" class="mt-3"></div></div></div></div>
<div id="dashboard" hidden><div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><p class="eyebrow mb-1">STORE MANAGEMENT</p><h2>Admin dashboard</h2></div><button id="logout" class="btn btn-outline-dark">Log out</button></div>
<div class="card admin-card p-4 mb-4"><h4>Add iPhone</h4><form id="product-form" class="row g-3"><div class="col-md-6"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-6"><select class="form-select" name="category"><option>Smartphones</option><option>Audio</option><option>Accessories</option><option>Smartwatches</option><option>Computers</option><option>Other electronics</option></select></div><div class="col-md-4"><input class="form-control" name="price" type="number" min="0" step=".01" placeholder="Sale price (USD)" required></div><div class="col-md-4"><input class="form-control" name="original_price" type="number" min="0" step=".01" placeholder="Original price (USD)" required></div><div class="col-md-4"><input class="form-control" name="stock" type="number" min="0" step="1" placeholder="Stock quantity" required></div><div class="col-md-4"><input class="form-control" name="image_url" placeholder="Image URL (optional)"></div><div class="col-12"><textarea class="form-control" name="description" placeholder="Short description"></textarea></div><div class="col-12"><button class="btn btn-info fw-bold">Save iPhone</button></div></form><div id="product-message" class="mt-3"></div></div>
<div class="card admin-card p-4 mb-4"><h4>iPhone catalog (USD)</h4><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="admin-products"></tbody></table></div></div>
<div class="card admin-card p-4"><h4>Recent orders (USD)</h4><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Delivery</th><th>Update</th></tr></thead><tbody id="admin-orders"></tbody></table></div></div></div></main><script src="/admin.js"></script></body></html>
